replicaCount: 1

image:
  repository: sds-middleware
  tag: latest
  pullPolicy: Never

config:
  # Create this Secret from .env before installing the chart:
  # kubectl create secret generic sds-runtime-env --from-env-file=.env -n sds-middleware
  existingSecret: sds-runtime-env

service:
  type: LoadBalancer
  port: 8080

resources: {}
