services:
  sds-middleware:
    image: sds-middleware:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      # Admin console secret
      ADMIN_SECRET_CODE: 'admin-secret-2026'
      # Operations console secret
      OPS_SECRET_CODE: 'ops-secret-2026'
    volumes:
      # Mount storages directory with read/write permissions (bind mount)
      - ./storages:/app/storages
      # Optional configuration file
      # - ./.env:/app/.env:ro
      # Mount logs directory
      - ./logs:/app/logs
    networks:
      - sds-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  sds-network:
    driver: bridge
