apiVersion: apps/v1
kind: Deployment
metadata:
  name: sds-middleware-app
  namespace: sds-middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sds-middleware
  template:
    metadata:
      labels:
        app: sds-middleware
    spec:
      containers:
      - name: app
        image: sds-middleware:latest
        imagePullPolicy: Never  # Use local image for OrbStack
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - secretRef:
            name: sds-runtime-env
        volumeMounts:
        - name: storages
          mountPath: /app/storages
        - name: logs
          mountPath: /app/logs
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - >-
              curl --fail --silent --show-error -H "X-Client-Secret: $WEBSERVER__CLIENT_SECRET" http://localhost:8080/config/db
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 10
      volumes:
      - name: storages
        emptyDir: {}
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sds-middleware-service
  namespace: sds-middleware
spec:
  selector:
    app: sds-middleware
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  type: LoadBalancer  # OrbStack supports LoadBalancer
