apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sds-middleware.fullname" . }}
  labels:
    {{- include "sds-middleware.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sds-middleware.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sds-middleware.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: sds-middleware
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ required "config.existingSecret is required" .Values.config.existingSecret }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl --fail --silent --show-error -H "X-Client-Secret: $WEBSERVER__CLIENT_SECRET" http://localhost:8080/config/db
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
