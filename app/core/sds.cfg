[webserver]
url_base_path = /
debug_level = DEBUG
port = 8080
env = dev
use_ssl = on
cert_file = </path/to/fullchain.pem>
key_file = </path/to/privkey.pem>
ssl_hostname = <hostname>
client_secret = <your-default-client-secret-here>

[site_site1]
client_secret = <site1-client-secret>

[site_site2]
client_secret = <site2-client-secret>

[site_site3]
client_secret = <site3-client-secret>

[sds_sync]
hsi_bin_path = /usr/local/bin
hsi_keytab_path = </path/to/xxx.keytab>
hsi_user = <hsi username>
firewall_flag = on
timeout_in_secs = 3300

[sds_async]
message_broker_host = localhost
message_broker_port = 5672
work_queue = isdp_task_queue
same_job_minimum_interval_in_min = 360
black_list = </path/to/black_list.txt>

[worker]
staging_dir = staging
smtp_server = localhost
email_sender = <email_sender>
contact_email = <contact_email>
http_download_server = https://<hostname>/staging
staging_usage_threshold_in_gb = 1

[database]
host = localhost
user = dbtester
password = <database-password>
db = my_app_db
job_table = user_jobs

[logging]
api_log_file = api.log
worker_log_file = worker.log

