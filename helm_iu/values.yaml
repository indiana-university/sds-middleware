nameOverride: ""
fullnameOverride: ""
# Override when deploying to a different IU Kubernetes namespace.
namespace: ua-vpit--research-technologies--rds

sdsMiddleware:
  replicas: 1
  image:
    # Override for the published IU registry image.
    repository: registry.docker.iu.edu/rds/sds-middleware
    tag: latest
    pullPolicy: Always
  imagePullSecrets: []
  rolloutToken: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      # IU Enterprise Kubernetes requires requests on every container. These
      # values reserve no capacity; scheduling is governed by the limits.
      cpu: "0"
      memory: "0"
    limits:
      cpu: "1"
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
  readinessProbe:
    exec:
      command:
        - sh
        - -c
        - >-
          curl --fail --silent --show-error -H "X-Client-Secret: $WEBSERVER__CLIENT_SECRET" http://localhost:8080/config/db
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 10

config:
  # Created by deploy_helm_iu.sh from the local .env file.
  existingSecret: sds-middleware-env

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: sds-middleware.apps.iu.edu
  path: /
  pathType: Prefix
  tls: []
